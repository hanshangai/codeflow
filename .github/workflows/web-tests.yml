name: Web tests

on:
  workflow_dispatch:
  push:
    paths:
      - "apps/web/**"
      - "packages/shared/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - ".github/workflows/web-tests.yml"
  pull_request:
    paths:
      - "apps/web/**"
      - "packages/shared/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - ".github/workflows/web-tests.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.23.2"
      - uses: pnpm/action-setup@v4
        with:
          version: "10.14.0"
      - run: pnpm install --frozen-lockfile
      - name: Install browsers for web E2E
        run: pnpm -C apps/web exec playwright install chromium webkit
      - name: Typecheck web
        run: pnpm -C apps/web typecheck
      - name: Typecheck web tests
        run: pnpm -C apps/web typecheck:tests
      - name: Web unit tests
        run: pnpm test:web:unit
      - name: Web local E2E
        run: pnpm -C apps/web test:e2e
